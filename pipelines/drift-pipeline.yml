# Scheduled drift check: compares Azure Policy in each environment with the main branch.
# Read-only. Drifted resources show as failed tests in the Tests tab and in the run summary.
# To fix drift, either run the deploy pipeline (Azure goes back to what Git says) or commit the
# Azure change to Git (Git catches up to Azure).
trigger: none
pr: none

schedules:
  - cron: '0 */6 * * *'   # every 6 hours
    displayName: Drift check
    branches:
      include: [ main ]
    always: true

parameters:
  - name: failOnDrift
    displayName: Fail the run when drift is found
    type: boolean
    default: true
  - name: failOnUnmanaged
    displayName: Also fail on custom policy created outside the pipeline
    type: boolean
    default: false

variables:
  - group: azure-policy

stages:
  - stage: Drift
    displayName: Drift check
    jobs:
      - job: Drift
        strategy:
          matrix:
            dev:
              policyEnvironment: dev
              serviceConnection: sc-azure-policy-dev
              subscriptionId: $(DEV_SUBSCRIPTION_ID)
            prod:
              policyEnvironment: prod
              serviceConnection: sc-azure-policy-prod
              subscriptionId: $(PROD_SUBSCRIPTION_ID)
        pool:
          vmImage: windows-latest
        steps:
          - checkout: self
          - task: AzurePowerShell@5
            name: drift
            displayName: Compare Azure with source control ($(policyEnvironment))
            inputs:
              azureSubscription: $(serviceConnection)
              azurePowerShellVersion: LatestVersion
              pwsh: true
              ScriptType: FilePath
              ScriptPath: scripts/Invoke-PolicyDrift.ps1
              ScriptArguments: >-
                -Environment '$(policyEnvironment)'
                -OutputPath '$(Common.TestResultsDirectory)'
                ${{ iif(parameters.failOnDrift, '-FailOnDrift', '') }}
                ${{ iif(parameters.failOnUnmanaged, '-FailOnUnmanaged', '') }}
            env:
              POLICY_SUBSCRIPTION_ID: $(subscriptionId)
          - task: PublishTestResults@2
            displayName: Publish drift results
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: '$(Common.TestResultsDirectory)/drift.xml'
              testRunTitle: Azure Policy drift ($(policyEnvironment))
              failTaskOnFailedTests: false
          - publish: $(Common.TestResultsDirectory)
            artifact: drift-$(policyEnvironment)
            displayName: Publish drift report
            condition: succeededOrFailed()
